name: Gerar relatório

on:
  workflow_dispatch:
    inputs:
      org_id:
        description: "ID da organização (ex: 6 para Top Sports)"
        required: true
        type: string
      start_date:
        description: "Data inicial (YYYY-MM-DD, inclusive)"
        required: true
        type: string
      end_date:
        description: "Data final (YYYY-MM-DD, inclusive)"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Gerar relatório
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ORG_ID: ${{ inputs.org_id }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: npm run generate

      - name: Commit relatório gerado
        run: |
          git config user.name "merkos-relatorios-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Gera relatório (org ${{ inputs.org_id }}, ${{ inputs.start_date }} a ${{ inputs.end_date }})"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - uses: actions/deploy-pages@v4
