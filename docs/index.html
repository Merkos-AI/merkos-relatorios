<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Relatórios de Atendimento com IA — Merkos</title>
<style>
  :root {
    --dark: #171110;
    --red: #c8102e;
    --blue: #2f6fdb;
    --gray: #5c5c5c;
    --border: #e5e2e0;
    /* tokens do sistema Merkos, pro date picker ficar identico */
    --primary: hsl(348, 100%, 40%);
    --primary-foreground: hsl(0, 0%, 100%);
    --accent: hsl(348, 100%, 18%);
    --accent-foreground: hsl(0, 0%, 100%);
    --muted-foreground: hsl(25, 5.3%, 44.7%);
    --popover: hsl(0, 0%, 100%);
    --popover-foreground: hsl(20, 14.3%, 4.1%);
    --dp-border: hsl(20, 5.9%, 90%);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1f1f1f;
    background: #fff;
  }
  .page { max-width: 880px; margin: 0 auto; padding-bottom: 60px; }
  header {
    background: var(--dark);
    color: #fff;
    padding: 28px 32px;
  }
  header img { height: 32px; margin-bottom: 16px; }
  header h1 { font-size: 20px; margin: 0 0 4px; }
  header p { margin: 0; opacity: 0.75; font-size: 14px; }

  .toolbar {
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    padding: 24px 32px 0;
  }
  .toolbar select, .toolbar input {
    padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; background: #fff;
  }
  .toolbar select#orgSelect { min-width: 220px; }
  .toolbar label { font-size: 13px; color: var(--gray); display: flex; flex-direction: column; gap: 4px; }
  .toolbar > button {
    padding: 10px 20px; border: none; border-radius: 8px; background: var(--red);
    color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; align-self: flex-end;
  }
  .toolbar > button:hover { opacity: 0.9; }
  .period-note { padding: 0 32px; margin-top: 8px; font-size: 13px; color: var(--gray); }
  .period-note select { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }

  .shortcuts { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 32px 0; }
  .chip {
    padding: 6px 14px; border: 1px solid var(--border); border-radius: 999px; background: #fff;
    font-size: 13px; color: #1f1f1f; cursor: pointer; font-family: inherit;
  }
  .chip:hover { background: #f7f5f4; }
  .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }

  /* Date picker (mesmo padrao visual do sistema Merkos: shadcn/ui + react-day-picker) */
  .dp-wrap { position: relative; }
  .dp-trigger {
    height: 40px; width: 168px; display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 0 12px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff;
    font-size: 14px; color: #1f1f1f; cursor: pointer; font-family: inherit;
  }
  .dp-trigger:hover { background: #fafafa; }
  .dp-trigger .dp-placeholder { color: var(--muted-foreground); }
  .dp-trigger svg { flex-shrink: 0; color: var(--muted-foreground); }
  .dp-panel {
    display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 30;
    background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--dp-border);
    border-radius: var(--radius, 0.5rem); box-shadow: 0 10px 30px rgba(0,0,0,0.12); padding: 16px; width: 280px;
  }
  .dp-panel.open { display: block; }
  .dp-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .dp-nav button {
    height: 28px; width: 28px; border: 1px solid var(--dp-border); border-radius: 6px; background: transparent;
    display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0.6; padding: 0;
  }
  .dp-nav button:hover { opacity: 1; background: #f5f5f4; }
  .dp-nav .dp-month-label { font-size: 14px; font-weight: 600; }
  .dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .dp-weekday { text-align: center; font-size: 0.72rem; color: var(--muted-foreground); padding-bottom: 6px; }
  .dp-day {
    height: 36px; width: 36px; border: none; background: transparent; border-radius: 6px; font-size: 13.5px;
    font-weight: 400; color: #1f1f1f; cursor: pointer;
  }
  .dp-day:hover:not(.dp-selected):not(:disabled) { background: #f1efee; }
  .dp-day.dp-outside { color: var(--muted-foreground); opacity: 0.5; }
  .dp-day.dp-today { background: var(--accent); color: var(--accent-foreground); }
  .dp-day.dp-selected, .dp-day.dp-selected:hover { background: var(--primary); color: var(--primary-foreground); }
  .dp-day:disabled { color: var(--muted-foreground); opacity: 0.4; cursor: not-allowed; }


  main { padding: 32px; }
  h2 { font-size: 26px; margin-bottom: 8px; }
  .lead { color: var(--gray); line-height: 1.5; margin-bottom: 28px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 32px; }
  .card { border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .card .num { font-size: 32px; font-weight: 800; }
  .card .num.red { color: var(--red); }
  .card .num.blue { color: var(--blue); }
  .card .label { margin-top: 4px; font-size: 14px; }
  .card .sub { color: var(--gray); font-size: 13px; }
  section { border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
  section h3 { margin-top: 0; font-size: 18px; }
  section .desc { color: var(--gray); font-size: 14px; margin-bottom: 16px; }
  .split-bar { display: flex; height: 28px; border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
  .split-bar .ia { background: var(--red); }
  .split-bar .humano { background: var(--blue); }
  .legend { display: flex; gap: 24px; font-size: 14px; flex-wrap: wrap; }
  .legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .legend .ia-dot { background: var(--red); }
  .legend .humano-dot { background: var(--blue); }
  .cat-row { display: grid; grid-template-columns: 220px 1fr 110px; align-items: center; gap: 12px; margin-bottom: 14px; font-size: 14px; }
  .cat-bar-track { background: #f1efee; border-radius: 6px; height: 14px; overflow: hidden; }
  .cat-bar-fill { background: var(--red); height: 100%; }
  .cat-bar-fill.muted { background: #b9b6b4; }
  .cat-value { text-align: right; color: var(--gray); font-size: 13px; }
  .footnote { font-size: 12px; color: var(--gray); margin-top: 8px; }
  .insight-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .insight-card { border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .insight-tag { display: inline-block; background: #fde8ea; color: var(--red); font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; margin-bottom: 10px; }
  .insight-card h3 { font-size: 15px; margin: 0 0 6px; }
  .insight-card p { font-size: 13px; color: var(--gray); margin: 0; line-height: 1.5; }
  .highlight { background: #fde8ea; border-radius: 12px; padding: 18px 20px; font-size: 15px; }
  .highlight b { color: var(--red); }
  footer { padding: 24px 32px; font-size: 12px; color: var(--gray); border-top: 1px solid var(--border); }
  footer b { color: #1f1f1f; }
  .empty { color: var(--gray); padding: 24px 32px; }
  .pdf-btn {
    padding: 10px 20px; border: 1px solid var(--border); border-radius: 8px; background: #fff;
    color: #1f1f1f; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .pdf-btn:hover { background: #f7f5f4; }

  @media (max-width: 600px) {
    .cards, .insight-grid { grid-template-columns: 1fr; }
    .cat-row { grid-template-columns: 1fr; }
    .cat-value { text-align: left; }
  }

  @media print {
    .toolbar, .period-note { display: none !important; }
    body { background: #fff; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <img src="assets/merkos-logo.png" alt="Merkos" />
    <h1>Relatório de Atendimento com IA</h1>
    <p id="headerSubtitle">Selecione um cliente para ver o relatório</p>
  </header>

  <div class="toolbar">
    <label>Cliente
      <select id="orgSelect"></select>
    </label>
    <label>A partir de
      <div class="dp-wrap" id="startPickerWrap"></div>
    </label>
    <label>Até
      <div class="dp-wrap" id="endPickerWrap"></div>
    </label>
    <button id="filterBtn" type="button">Filtrar</button>
    <button id="pdfBtn" type="button" class="pdf-btn" style="display:none">⬇ Baixar PDF</button>
  </div>
  <div class="shortcuts" id="shortcuts">
    <button type="button" class="chip" data-kind="7d">Últimos 7 dias</button>
    <button type="button" class="chip" data-kind="30d">Últimos 30 dias</button>
    <button type="button" class="chip" data-kind="lastMonth">Mês passado</button>
    <button type="button" class="chip" data-kind="thisMonth">Mês atual</button>
    <button type="button" class="chip" data-kind="90d">Últimos 90 dias</button>
  </div>
  <p class="period-note" id="periodNote" style="display:none"></p>

  <div id="reportView"></div>
  <p class="empty" id="emptyMsg" style="display:none">Nenhum relatório encontrado para esse cliente/período. Rode o workflow "Gerar relatório" no GitHub Actions.</p>
</div>

<script>
  let allEntries = [];
  let currentData = null;

  function pct(part, total) {
    if (total === 0) return '0,0';
    return ((part / total) * 100).toFixed(1).replace('.', ',');
  }

  function barWidth(count, max) {
    return max === 0 ? 0 : Math.round((count / max) * 100);
  }

  function genericInsight(category) {
    return {
      title: category,
      body: 'Essas perguntas já têm resposta padrão hoje. Cadastrando essas informações na base de conhecimento, a IA responde na hora — inclusive fora do horário comercial.',
    };
  }

  function renderReport(data) {
    const totalResolvidas = data.resolvidaIa + data.comHumano;
    const resolvidaPct = pct(data.resolvidaIa, totalResolvidas);
    const humanoPct = pct(data.comHumano, totalResolvidas);
    const resolvidaWidth = totalResolvidas === 0 ? 0 : (data.resolvidaIa / totalResolvidas) * 100;

    const sortedCategories = [...data.categoryCounts].sort((a, b) => b.count - a.count);
    const maxCount = sortedCategories.length > 0 ? sortedCategories[0].count : 0;
    const totalHumano = data.comHumano || 1;

    const categoryRows = sortedCategories
      .map((c) => `
        <div class="cat-row">
          <div class="cat-label">${c.category}${c.starred ? ' *' : ''}</div>
          <div class="cat-bar-track"><div class="cat-bar-fill ${c.starred ? 'muted' : ''}" style="width:${barWidth(c.count, maxCount)}%"></div></div>
          <div class="cat-value">${c.count} · ${pct(c.count, totalHumano)}%</div>
        </div>`)
      .join('\n');

    const eligibleForInsights = sortedCategories.filter((c) => !c.starred);
    const top3 = eligibleForInsights.slice(0, 3);

    const topInsights = top3
      .map((c) => {
        const insight = data.insights[c.category] || genericInsight(c.category);
        return `
          <div class="insight-card">
            <span class="insight-tag">${pct(c.count, totalHumano)}% das conversas</span>
            <h3>${insight.title}</h3>
            <p>${insight.body}</p>
          </div>`;
      })
      .join('\n');

    const insightsTotalPct = top3.reduce((sum, c) => sum + (c.count / totalHumano) * 100, 0);
    const messagesPerDay = Math.round(data.messages.USER / data.totalDays);
    const totalMsgs = data.messages.USER + data.messages.AGENT + data.messages.HUMAN;

    document.getElementById('headerSubtitle').textContent = `${data.orgName} · ${data.periodLabel}`;

    document.getElementById('reportView').innerHTML = `
      <main>
        <h2>Como a IA atendeu seus clientes no WhatsApp</h2>
        <p class="lead">Resumo de todas as conversas do período: o volume de mensagens, quanto a assistente virtual resolveu sozinha e quais assuntos ainda precisaram da sua equipe — com as oportunidades para a IA atender ainda mais.</p>

        <div class="cards">
          <div class="card"><div class="num">${data.messages.USER.toLocaleString('pt-BR')}</div><div class="label">Mensagens recebidas de clientes</div><div class="sub">≈ ${messagesPerDay} por dia</div></div>
          <div class="card"><div class="num red">${data.messages.AGENT.toLocaleString('pt-BR')}</div><div class="label">Respostas enviadas pela IA</div><div class="sub">automáticas, em segundos</div></div>
          <div class="card"><div class="num blue">${data.messages.HUMAN.toLocaleString('pt-BR')}</div><div class="label">Mensagens enviadas pela equipe</div><div class="sub">atendimento humano</div></div>
          <div class="card"><div class="num">${data.totalConversas.toLocaleString('pt-BR')}</div><div class="label">Conversas no período</div><div class="sub">${data.totalDays} dias</div></div>
        </div>

        <section>
          <h3>Quem atendeu cada conversa</h3>
          <p class="desc">Das ${data.totalConversas.toLocaleString('pt-BR')} conversas, a IA resolveu ${data.resolvidaIa.toLocaleString('pt-BR')} do início ao fim. As outras ${data.comHumano.toLocaleString('pt-BR')} tiveram participação da equipe — por transferência da IA ou contato direto.</p>
          <div class="split-bar"><div class="ia" style="width:${resolvidaWidth}%"></div><div class="humano" style="width:${100 - resolvidaWidth}%"></div></div>
          <div class="legend">
            <span><span class="dot ia-dot"></span>Resolvidas 100% pela IA — <b>${data.resolvidaIa} (${resolvidaPct}%)</b></span>
            <span><span class="dot humano-dot"></span>Com atendimento humano — <b>${data.comHumano} (${humanoPct}%)</b></span>
          </div>
        </section>

        <section>
          <h3>Assuntos das conversas que foram para a equipe</h3>
          <p class="desc">Cada uma das ${data.comHumano.toLocaleString('pt-BR')} conversas com atendimento humano foi classificada pelo assunto que motivou a participação da equipe.</p>
          ${categoryRows}
          <p class="footnote">* Não são limitações da IA: mensagens enviadas pela própria equipe (confirmações, cobranças) e conversas sem assunto definido.</p>
        </section>

        <section>
          <h3>Onde a IA pode passar a atender</h3>
          <p class="desc">Frentes que cobrem a maior parte das transferências de hoje:</p>
          <div class="insight-grid">${topInsights}</div>
          <br/>
          <div class="highlight">Somadas, essas frentes representam até <b>${insightsTotalPct.toFixed(0)}% das conversas</b> que hoje vão para a equipe — e que a IA poderia atender de imediato.</div>
        </section>
      </main>
      <footer>
        Fonte: conversas de WhatsApp da ${data.orgName} entre ${data.startDate} e ${data.endDate} (${data.totalConversas.toLocaleString('pt-BR')} conversas, ${totalMsgs.toLocaleString('pt-BR')} mensagens). Classificação de assuntos feita a partir das mensagens do cliente imediatamente anteriores à entrada da equipe na conversa, via IA. — <b>Merkos</b>
      </footer>
    `;
  }

  // ---- Date picker (visual identico ao calendario do sistema Merkos) ----
  const WEEKDAYS_PT = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  const MONTHS_PT_FULL = [
    'janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
    'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro',
  ];
  const ICON_CALENDAR = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>';
  const ICON_CHEVRON_LEFT = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>';
  const ICON_CHEVRON_RIGHT = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';

  function toISO(y, m, d) {
    return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  }

  function createDatePicker(wrapId) {
    const wrap = document.getElementById(wrapId);
    let selectedISO = '';
    let viewYear = new Date().getFullYear();
    let viewMonth = new Date().getMonth();

    wrap.innerHTML = `
      <button type="button" class="dp-trigger">
        <span class="dp-label dp-placeholder">dd/mm/aaaa</span>
        ${ICON_CALENDAR}
      </button>
      <div class="dp-panel">
        <div class="dp-nav">
          <button type="button" class="dp-prev">${ICON_CHEVRON_LEFT}</button>
          <span class="dp-month-label"></span>
          <button type="button" class="dp-next">${ICON_CHEVRON_RIGHT}</button>
        </div>
        <div class="dp-grid dp-weekdays">${WEEKDAYS_PT.map((w) => `<div class="dp-weekday">${w}</div>`).join('')}</div>
        <div class="dp-grid dp-days"></div>
      </div>
    `;

    const trigger = wrap.querySelector('.dp-trigger');
    const label = wrap.querySelector('.dp-label');
    const panel = wrap.querySelector('.dp-panel');
    const monthLabel = wrap.querySelector('.dp-month-label');
    const daysGrid = wrap.querySelector('.dp-days');

    function renderGrid() {
      monthLabel.textContent = `${MONTHS_PT_FULL[viewMonth]} de ${viewYear}`;
      const firstDay = new Date(viewYear, viewMonth, 1).getDay();
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
      const todayISO = new Date().toISOString().slice(0, 10);

      let cells = [];
      for (let i = firstDay - 1; i >= 0; i--) {
        cells.push({ day: daysInPrevMonth - i, outside: true, y: viewMonth === 0 ? viewYear - 1 : viewYear, m: viewMonth === 0 ? 11 : viewMonth - 1 });
      }
      for (let d = 1; d <= daysInMonth; d++) {
        cells.push({ day: d, outside: false, y: viewYear, m: viewMonth });
      }
      const remainder = cells.length % 7;
      const trailingCount = remainder === 0 ? 0 : 7 - remainder;
      for (let d = 1; d <= trailingCount; d++) {
        cells.push({ day: d, outside: true, y: viewMonth === 11 ? viewYear + 1 : viewYear, m: viewMonth === 11 ? 0 : viewMonth + 1 });
      }

      daysGrid.innerHTML = cells
        .map((c) => {
          const iso = toISO(c.y, c.m, c.day);
          const classes = ['dp-day'];
          if (c.outside) classes.push('dp-outside');
          if (iso === todayISO) classes.push('dp-today');
          if (iso === selectedISO) classes.push('dp-selected');
          return `<button type="button" class="${classes.join(' ')}" data-iso="${iso}">${c.day}</button>`;
        })
        .join('');
    }

    function updateLabel() {
      if (!selectedISO) {
        label.textContent = 'dd/mm/aaaa';
        label.classList.add('dp-placeholder');
        return;
      }
      const [y, m, d] = selectedISO.split('-');
      label.textContent = `${d}/${m}/${y}`;
      label.classList.remove('dp-placeholder');
    }

    trigger.addEventListener('click', (ev) => {
      ev.stopPropagation();
      document.querySelectorAll('.dp-panel.open').forEach((p) => { if (p !== panel) p.classList.remove('open'); });
      panel.classList.toggle('open');
      renderGrid();
    });

    wrap.querySelector('.dp-prev').addEventListener('click', () => {
      viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      renderGrid();
    });
    wrap.querySelector('.dp-next').addEventListener('click', () => {
      viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      renderGrid();
    });

    daysGrid.addEventListener('click', (ev) => {
      const btn = ev.target.closest('.dp-day');
      if (!btn) return;
      selectedISO = btn.dataset.iso;
      updateLabel();
      panel.classList.remove('open');
      clearActiveChip();
    });

    document.addEventListener('click', (ev) => {
      if (!wrap.contains(ev.target)) panel.classList.remove('open');
    });

    return {
      getValue: () => selectedISO,
      setValue: (iso) => {
        selectedISO = iso || '';
        if (iso) {
          const [y, m] = iso.split('-').map(Number);
          viewYear = y; viewMonth = m - 1;
        }
        updateLabel();
      },
    };
  }

  const startPicker = createDatePicker('startPickerWrap');
  const endPicker = createDatePicker('endPickerWrap');

  // ---- Atalhos de periodo (chips) ----
  function isoFromDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function addDaysLocal(d, days) {
    const copy = new Date(d);
    copy.setDate(copy.getDate() + days);
    return copy;
  }

  function clearActiveChip() {
    document.querySelectorAll('.chip.active').forEach((c) => c.classList.remove('active'));
  }

  function applyShortcut(kind, chipEl) {
    const today = new Date();
    let start, end;

    if (kind === '7d') {
      start = addDaysLocal(today, -6);
      end = today;
    } else if (kind === '30d') {
      start = addDaysLocal(today, -29);
      end = today;
    } else if (kind === '90d') {
      start = addDaysLocal(today, -89);
      end = today;
    } else if (kind === 'thisMonth') {
      start = new Date(today.getFullYear(), today.getMonth(), 1);
      end = today;
    } else if (kind === 'lastMonth') {
      const firstOfThisMonth = new Date(today.getFullYear(), today.getMonth(), 1);
      end = addDaysLocal(firstOfThisMonth, -1);
      start = new Date(end.getFullYear(), end.getMonth(), 1);
    }

    startPicker.setValue(isoFromDate(start));
    endPicker.setValue(isoFromDate(end));
    clearActiveChip();
    chipEl.classList.add('active');
    applyFilter();
  }

  document.querySelectorAll('#shortcuts .chip').forEach((chip) => {
    chip.addEventListener('click', () => applyShortcut(chip.dataset.kind, chip));
  });

  // Um relatorio "cobre" o filtro se o intervalo dele tem qualquer sobreposicao
  // com [startFilter, endFilter]. Datas em branco = sem limite naquele lado.
  function matchesDateFilter(entry, startFilter, endFilter) {
    if (startFilter && entry.endDate < startFilter) return false;
    if (endFilter && entry.startDate > endFilter) return false;
    return true;
  }

  function applyFilter() {
    const orgSlug = document.getElementById('orgSelect').value;
    const startFilter = startPicker.getValue();
    const endFilter = endPicker.getValue();

    const matches = allEntries
      .filter((e) => e.orgSlug === orgSlug && matchesDateFilter(e, startFilter, endFilter))
      .sort((a, b) => (a.startDate < b.startDate ? 1 : -1));

    const periodNote = document.getElementById('periodNote');
    const emptyMsg = document.getElementById('emptyMsg');

    if (matches.length === 0) {
      document.getElementById('reportView').innerHTML = '';
      document.getElementById('pdfBtn').style.display = 'none';
      periodNote.style.display = 'none';
      emptyMsg.style.display = 'block';
      const orgName = document.getElementById('orgSelect').selectedOptions[0]?.textContent ?? '';
      document.getElementById('headerSubtitle').textContent = `${orgName} · nenhum relatório nesse período`;
      return;
    }
    emptyMsg.style.display = 'none';

    if (matches.length > 1) {
      periodNote.style.display = 'block';
      periodNote.innerHTML = `${matches.length} relatórios encontrados nesse intervalo — mostrando o mais recente (${matches[0].periodLabel}). Outros: ${matches
        .slice(1)
        .map((m) => `<a href="#" data-file="${m.dataFile}" class="pick-period">${m.periodLabel}</a>`)
        .join(', ')}`;
      periodNote.querySelectorAll('.pick-period').forEach((a) => {
        a.addEventListener('click', (ev) => {
          ev.preventDefault();
          loadReport(a.dataset.file);
        });
      });
    } else {
      periodNote.style.display = 'none';
    }

    loadReport(matches[0].dataFile);
  }

  function loadReport(dataFile) {
    updatePermalink(dataFile);
    fetch(dataFile)
      .then((r) => r.json())
      .then((data) => {
        currentData = data;
        renderReport(data);
        document.getElementById('pdfBtn').style.display = 'inline-block';
      });
  }

  function updatePermalink(dataFile) {
    const url = new URL(window.location.href);
    url.searchParams.set('r', dataFile);
    window.history.replaceState({}, '', url);
  }

  function init(entries) {
    allEntries = entries;
    if (entries.length === 0) {
      document.getElementById('emptyMsg').style.display = 'block';
      return;
    }

    const orgs = [...new Map(entries.map((e) => [e.orgSlug, e.org])).entries()];
    const orgSelect = document.getElementById('orgSelect');
    orgSelect.innerHTML = orgs.map(([slug, name]) => `<option value="${slug}">${name}</option>`).join('');

    const params = new URLSearchParams(window.location.search);
    const requested = params.get('r');
    const requestedEntry = requested ? entries.find((e) => e.dataFile === requested) : null;

    orgSelect.value = requestedEntry ? requestedEntry.orgSlug : orgs[0][0];
    if (requestedEntry) {
      startPicker.setValue(requestedEntry.startDate);
      endPicker.setValue(requestedEntry.endDate);
    }

    applyFilter();

    document.getElementById('filterBtn').addEventListener('click', applyFilter);
    document.getElementById('pdfBtn').addEventListener('click', () => window.print());
  }

  fetch('data/index.json')
    .then((r) => r.json())
    .then(init)
    .catch(() => {
      document.getElementById('emptyMsg').style.display = 'block';
    });
</script>
</body>
</html>
